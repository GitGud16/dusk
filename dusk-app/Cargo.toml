[package]
name = "dusk-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "dusk"
path = "src/main.rs"

[dependencies]
dusk-core.workspace = true
dusk-engine = { workspace = true, features = ["gpu"] }
slint.workspace = true
anyhow.workspace = true

# The system file dialogs (src/platform). Slint, cpal and wgpu already build this crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[build-dependencies]
slint-build.workspace = true
