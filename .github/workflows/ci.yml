name: CI

# Pushed tags build the installer in release.yml instead.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  windows:
    runs-on: windows-2025
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # A daily BtbN build is deleted upstream after about two weeks, and the pin moves along
      # until it rests on a month-end build (docs/SETUP.md); the cache keeps CI working between
      # moves.
      - name: Cache the pinned FFmpeg zip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\dusk\ffmpeg-cache
          key: ffmpeg-${{ hashFiles('scripts/ffmpeg-pin.psd1') }}

      - name: Install the pinned FFmpeg and export the dev environment
        shell: pwsh
        run: |
          ./scripts/setup-ffmpeg.ps1
          . ./scripts/dev-env.ps1
          "FFMPEG_DIR=$env:FFMPEG_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=$env:LIBCLANG_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:FFMPEG_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (workspace, gpu on)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace, gpu on)
        run: cargo test --workspace

      - name: Clippy (dusk-engine without gpu)
        run: cargo clippy -p dusk-engine --no-default-features --all-targets -- -D warnings

      - name: Test (dusk-engine without gpu)
        run: cargo test -p dusk-engine --no-default-features

      - name: Build dusq alone (no gpu feature)
        run: cargo build -p dusk-cli --release

      - name: dusq never links wgpu
        shell: bash
        run: |
          deps=$(cargo tree -p dusk-cli -e normal,build --prefix none -f '{p}') || exit 1
          if grep -q '^wgpu ' <<<"$deps"; then echo "dusq links wgpu"; exit 1; fi

  # The installer (docs/ARCHITECTURE.md, "Release"), kept as an artifact to try. Built
  # once a commit, for its push: a pull request's own run of the same commit leaves it out.
  installer:
    if: github.event_name == 'push'
    runs-on: windows-2025
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Cache the pinned FFmpeg zip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\dusk\ffmpeg-cache
          key: ffmpeg-${{ hashFiles('scripts/ffmpeg-pin.psd1') }}

      - name: Install the pinned FFmpeg
        shell: pwsh
        run: ./scripts/setup-ffmpeg.ps1

      - uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup 6 when the runner lacks it
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-release.ps1

      - name: Install it, run both programs, uninstall it
        shell: pwsh
        run: ./scripts/check-installer.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: dusk-installer
          path: target/installer/*.exe
          if-no-files-found: error
