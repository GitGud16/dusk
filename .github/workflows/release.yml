name: Release

# Pushing a tag such as v0.1.0 builds the installer and drafts a release with it, for the
# maintainer to write the notes for and publish (docs/RELEASE.md, "Building and checking it").
# Once the repository has SignPath's variables and token (docs/RELEASE.md, "Signing"), the two
# programs and the installer are signed on the way, each after the maintainer approves the
# request in SignPath.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  draft:
    runs-on: windows-2025
    env:
      CARGO_TERM_COLOR: always
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag names the version being built
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "The tag $env:GITHUB_REF_NAME does not name the version in Cargo.toml ($version): tag v$version instead."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache the pinned FFmpeg zip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\dusk\ffmpeg-cache
          key: ffmpeg-${{ hashFiles('scripts/ffmpeg-pin.psd1') }}

      - name: Install the pinned FFmpeg
        shell: pwsh
        run: ./scripts/setup-ffmpeg.ps1

      - name: Install Inno Setup 6 when the runner lacks it
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build both programs
        shell: pwsh
        run: |
          . ./scripts/dev-env.ps1
          cargo build -p dusk-app --release
          if ($LASTEXITCODE -ne 0) { throw 'Building dusk.exe failed.' }
          # dusq on its own, so it builds without the gpu feature.
          cargo build -p dusk-cli --release
          if ($LASTEXITCODE -ne 0) { throw 'Building dusq.exe failed.' }

      - name: Hand the programs to SignPath
        id: programs
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: programs
          path: |
            target/release/dusk.exe
            target/release/dusq.exe

      - name: Sign the programs
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.programs.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/release

      - name: Build the installer
        shell: pwsh
        run: ./scripts/build-release.ps1 -NoBuild

      - name: Hand the installer to SignPath
        id: installer
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/installer/dusk-${{ env.VERSION }}-setup.exe

      - name: Sign the installer
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/installer

      - name: Install it, run both programs, uninstall it
        shell: pwsh
        run: |
          if ($env:SIGNING -eq 'true') { ./scripts/check-installer.ps1 -Signed } else { ./scripts/check-installer.ps1 }

      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "target/installer/dusk-$env:VERSION-setup.exe"
          gh release create $env:GITHUB_REF_NAME $setup --draft --title "Dusk $env:VERSION" `
            --notes "Draft: write what is new, then publish."
